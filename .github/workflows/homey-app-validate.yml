name: Validate Homey App
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  main:
    name: Validate Homey App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - uses: athombv/github-action-homey-app-validate@master
        with:
          level: publish

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run ESLint
        run: npm run lint
